name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request' && github.event.action == 'closed')

    runs-on: ubuntu-latest

    concurrency:
      group: alchemy-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || 'invalid' }}
      cancel-in-progress: false

    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Classify same-repository preview event
        id: preview_context
        env:
          IS_SAME_REPOSITORY_PREVIEW: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: echo "eligible=$IS_SAME_REPOSITORY_PREVIEW" >> "$GITHUB_OUTPUT"

      - name: Load production secrets from 1Password
        id: op_production
        if: >-
          github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

          CLOUDFLARE_API_TOKEN: op://github-actions/bankglass/CLOUDFLARE_API_TOKEN
          AKAHU_APP_TOKEN: op://github-actions/bankglass/AKAHU_APP_TOKEN
          AKAHU_USER_TOKEN: op://github-actions/bankglass/AKAHU_USER_TOKEN
          API_BEARER_TOKEN: op://github-actions/bankglass/API_BEARER_TOKEN

      - name: Install 1Password CLI for preview credential lookup
        if: steps.preview_context.outputs.eligible == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Resolve preview Cloudflare token from 1Password
        id: op_preview_cloudflare
        if: steps.preview_context.outputs.eligible == 'true'
        shell: bash
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail

          item="$(op item get bankglass --vault github-actions --format json)"
          preview_field_count="$(jq '[.fields[]? | select(.label == "CLOUDFLARE_PREVIEW_API_TOKEN")] | length' <<< "$item")"

          if [[ "$preview_field_count" == "0" ]]; then
            echo "Preview Cloudflare token field is absent; using the production token fallback." >&2
            token="$(jq -r '[.fields[]? | select(.label == "CLOUDFLARE_API_TOKEN")] | first | .value // ""' <<< "$item")"
          else
            token="$(jq -r '[.fields[]? | select(.label == "CLOUDFLARE_PREVIEW_API_TOKEN")] | first | .value // ""' <<< "$item")"
          fi

          if [[ -z "$token" ]]; then
            echo "The selected Cloudflare token field is empty." >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_OUTPUT"

      - name: Load preview bearer token from 1Password
        id: op_preview
        if: steps.preview_context.outputs.eligible == 'true'
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

          API_BEARER_TOKEN: op://github-actions/bankglass/PREVIEW_API_BEARER_TOKEN

      - name: Validate preview deployment credentials
        if: steps.preview_context.outputs.eligible == 'true'
        env:
          ACCESS_POLICY_AUD: ${{ secrets.ACCESS_POLICY_AUD }}
          API_BEARER_TOKEN: ${{ steps.op_preview.outputs.API_BEARER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ steps.op_preview_cloudflare.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$ACCESS_POLICY_AUD" || { echo "Missing ACCESS_POLICY_AUD" >&2; exit 1; }
          test -n "$API_BEARER_TOKEN" || { echo "Missing preview API_BEARER_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing preview and fallback CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Validate production secrets
        if: >-
          github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.op_production.outputs.CLOUDFLARE_API_TOKEN }}
          AKAHU_APP_TOKEN: ${{ steps.op_production.outputs.AKAHU_APP_TOKEN }}
          AKAHU_USER_TOKEN: ${{ steps.op_production.outputs.AKAHU_USER_TOKEN }}
          API_BEARER_TOKEN: ${{ steps.op_production.outputs.API_BEARER_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing production CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$AKAHU_APP_TOKEN" || { echo "Missing production AKAHU_APP_TOKEN" >&2; exit 1; }
          test -n "$AKAHU_USER_TOKEN" || { echo "Missing production AKAHU_USER_TOKEN" >&2; exit 1; }
          test -n "$API_BEARER_TOKEN" || { echo "Missing production API_BEARER_TOKEN" >&2; exit 1; }

      - name: Run Alchemy deployment
        # The trusted action keeps exact-SHA/fork policy centralized.
        # Preview code receives inert application credentials.
        uses: mynameistito/alchemy-deploy@02ab31c8b67974e0aaf71b02e654f3ffda8de62c # v3.1.3
        env:
          AKAHU_APP_TOKEN: >-
            ${{ steps.op_production.outputs.AKAHU_APP_TOKEN || 'preview-provider-disabled' }}

          AKAHU_USER_TOKEN: >-
            ${{ steps.op_production.outputs.AKAHU_USER_TOKEN || 'preview-provider-disabled' }}

          API_BEARER_TOKEN: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && steps.op_production.outputs.API_BEARER_TOKEN || steps.op_preview.outputs.API_BEARER_TOKEN }}

          CLOUDFLARE_API_TOKEN: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && steps.op_production.outputs.CLOUDFLARE_API_TOKEN || steps.op_preview_cloudflare.outputs.CLOUDFLARE_API_TOKEN }}

          ACCESS_POLICY_AUD: ${{ secrets.ACCESS_POLICY_AUD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          GITHUB_TOKEN: ${{ github.token }}

          ACCESS_APP_HOSTNAME: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.event == 'pull_request' &&
                format(
                  'bankglass-pr-{0}.{1}.workers.dev',
                  github.event.workflow_run.pull_requests[0].number,
                  vars.CLOUDFLARE_WORKERS_SUBDOMAIN
                ) ||
                vars.ACCESS_APP_HOSTNAME ||
                'bank.honetito.com' }}

          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          AKAHU_API_BASE_URL: ${{ vars.AKAHU_API_BASE_URL || 'https://api.akahu.io/v1' }}
          API_RATE_LIMIT_PER_MINUTE: ${{ vars.API_RATE_LIMIT_PER_MINUTE || '60' }}
          REFRESH_COOLDOWN_SECONDS: ${{ vars.REFRESH_COOLDOWN_SECONDS || '3600' }}
          SYNC_LOOKBACK_DAYS: ${{ vars.SYNC_LOOKBACK_DAYS || '14' }}

        with:
          worker-name: bankglass
          deploy-command: bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://bank.honetito.com
          use-adopt: true
