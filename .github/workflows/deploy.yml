name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

permissions: {}

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request' && github.event.action == 'closed')

    runs-on: ubuntu-24.04

    concurrency:
      group: alchemy-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || 'invalid' }}
      cancel-in-progress: false

    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Classify same-repository preview event
        id: preview_context
        env:
          IS_SAME_REPOSITORY_PREVIEW: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: echo "eligible=$IS_SAME_REPOSITORY_PREVIEW" >> "$GITHUB_OUTPUT"

      - name: Load production configuration from 1Password
        id: op_production
        if: >-
          github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}

          CLOUDFLARE_API_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/d6naythanqlr5tpznc4uusqdgq
          AKAHU_APP_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/2z24lkruqztbaho7uqoqjjsse4
          AKAHU_USER_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/lleillmqnh5ni57dki7edz7wqm
          API_BEARER_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/jqjhxjjni6c7nb4iwz2vp7o4hi
          ACCESS_POLICY_AUD: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/izs5fv5uc3gwtrqhn2jteap3ty
          CLOUDFLARE_ACCOUNT_ID: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/m3hawifr42jtbhh2a6dx2c5nwy
          ACCESS_APP_HOSTNAME: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/3dxm52aets6a56k74vj7habf7i
          ACCESS_TEAM_DOMAIN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/23b6osmzfojl6bblpdayommjhq
          AKAHU_API_BASE_URL: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/t5qmhl4p7mqui6irefzhvcckwa
          API_RATE_LIMIT_PER_MINUTE: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/2qyida4wopighmenp3gxrwgngy
          REFRESH_COOLDOWN_SECONDS: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/k4cozn3ao4azwyj6gsym2ex6qa
          SYNC_LOOKBACK_DAYS: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/56zvuakscsmjv4ofibg7gwhiie
          CLOUDFLARE_WORKERS_SUBDOMAIN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/66nv6ybjksk2fcto5e7blr2qlm

      - name: Install 1Password CLI for preview configuration lookup
        if: steps.preview_context.outputs.eligible == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}

      - name: Load preview configuration from 1Password
        id: op_preview
        if: steps.preview_context.outputs.eligible == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}

          PREVIEW_API_BEARER_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/preview_api_bearer_token
          CLOUDFLARE_API_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/d6naythanqlr5tpznc4uusqdgq
          ACCESS_POLICY_AUD: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/izs5fv5uc3gwtrqhn2jteap3ty
          CLOUDFLARE_ACCOUNT_ID: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/m3hawifr42jtbhh2a6dx2c5nwy
          ACCESS_APP_HOSTNAME: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/3dxm52aets6a56k74vj7habf7i
          ACCESS_TEAM_DOMAIN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/23b6osmzfojl6bblpdayommjhq
          AKAHU_API_BASE_URL: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/t5qmhl4p7mqui6irefzhvcckwa
          API_RATE_LIMIT_PER_MINUTE: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/2qyida4wopighmenp3gxrwgngy
          REFRESH_COOLDOWN_SECONDS: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/k4cozn3ao4azwyj6gsym2ex6qa
          SYNC_LOOKBACK_DAYS: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/56zvuakscsmjv4ofibg7gwhiie
          CLOUDFLARE_WORKERS_SUBDOMAIN: op://i56qshgciuy4cdg4pjrilaeriy/bu5cw4b3uoefkozgtoklyucvfi/66nv6ybjksk2fcto5e7blr2qlm

      - name: Load preview state bearer
        id: op_preview_state
        if: steps.preview_context.outputs.eligible == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}
          ALCHEMY_PREVIEW_STATE_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/ienc2qh3u37u2upcumftffpql4/credential

      - name: Validate preview deployment credentials
        if: steps.preview_context.outputs.eligible == 'true'
        env:
          API_BEARER_TOKEN: ${{ steps.op_preview.outputs.PREVIEW_API_BEARER_TOKEN }}
          ACCESS_POLICY_AUD: ${{ steps.op_preview.outputs.ACCESS_POLICY_AUD }}
          ACCESS_APP_HOSTNAME: ${{ steps.op_preview.outputs.ACCESS_APP_HOSTNAME }}
          ACCESS_TEAM_DOMAIN: ${{ steps.op_preview.outputs.ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ steps.op_preview.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op_preview.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ steps.op_preview.outputs.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          ALCHEMY_PREVIEW_STATE_URL: ${{ vars.ALCHEMY_PREVIEW_STATE_URL }}
          ALCHEMY_PREVIEW_STATE_EXPECTED_ORIGIN: ${{ vars.ALCHEMY_PREVIEW_STATE_EXPECTED_ORIGIN }}
          ALCHEMY_PREVIEW_STATE_TOKEN: ${{ steps.op_preview_state.outputs.ALCHEMY_PREVIEW_STATE_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$ACCESS_APP_HOSTNAME" || { echo "Missing preview ACCESS_APP_HOSTNAME" >&2; exit 1; }
          fi
          test -n "$ACCESS_TEAM_DOMAIN" || { echo "Missing ACCESS_TEAM_DOMAIN" >&2; exit 1; }
          test -n "$ACCESS_POLICY_AUD" || { echo "Missing ACCESS_POLICY_AUD" >&2; exit 1; }
          test -n "$API_BEARER_TOKEN" || { echo "Missing preview API_BEARER_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CLOUDFLARE_WORKERS_SUBDOMAIN" || { echo "Missing CLOUDFLARE_WORKERS_SUBDOMAIN" >&2; exit 1; }
          test -n "$ALCHEMY_PREVIEW_STATE_URL" || { echo "Missing preview state URL" >&2; exit 1; }
          test -n "$ALCHEMY_PREVIEW_STATE_EXPECTED_ORIGIN" || { echo "Missing preview state expected origin" >&2; exit 1; }
          test -n "$ALCHEMY_PREVIEW_STATE_TOKEN" || { echo "Missing preview state token" >&2; exit 1; }

      - name: Validate production secrets
        if: >-
          github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.op_production.outputs.CLOUDFLARE_API_TOKEN }}
          AKAHU_APP_TOKEN: ${{ steps.op_production.outputs.AKAHU_APP_TOKEN }}
          AKAHU_USER_TOKEN: ${{ steps.op_production.outputs.AKAHU_USER_TOKEN }}
          API_BEARER_TOKEN: ${{ steps.op_production.outputs.API_BEARER_TOKEN }}
          ACCESS_POLICY_AUD: ${{ steps.op_production.outputs.ACCESS_POLICY_AUD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op_production.outputs.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_APP_HOSTNAME: ${{ steps.op_production.outputs.ACCESS_APP_HOSTNAME }}
          ACCESS_TEAM_DOMAIN: ${{ steps.op_production.outputs.ACCESS_TEAM_DOMAIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing production CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$AKAHU_APP_TOKEN" || { echo "Missing production AKAHU_APP_TOKEN" >&2; exit 1; }
          test -n "$AKAHU_USER_TOKEN" || { echo "Missing production AKAHU_USER_TOKEN" >&2; exit 1; }
          test -n "$API_BEARER_TOKEN" || { echo "Missing production API_BEARER_TOKEN" >&2; exit 1; }
          test -n "$ACCESS_POLICY_AUD" || { echo "Missing production ACCESS_POLICY_AUD" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$ACCESS_APP_HOSTNAME" || { echo "Missing production ACCESS_APP_HOSTNAME" >&2; exit 1; }
          test -n "$ACCESS_TEAM_DOMAIN" || { echo "Missing production ACCESS_TEAM_DOMAIN" >&2; exit 1; }

      - name: Run Alchemy deployment
        # The trusted action keeps exact-SHA/fork policy centralized.
        # Preview code gets inert Akahu credentials and a separate API bearer token.
        uses: mynameistito/alchemy-deploy@0db293d18c4d6d99926cd74488f7eb6a26aa73bc # v4.0.0
        env:
          AKAHU_APP_TOKEN: >-
            ${{ steps.op_production.outputs.AKAHU_APP_TOKEN || 'preview-provider-disabled' }}

          AKAHU_USER_TOKEN: >-
            ${{ steps.op_production.outputs.AKAHU_USER_TOKEN || 'preview-provider-disabled' }}

          API_BEARER_TOKEN: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && steps.op_production.outputs.API_BEARER_TOKEN || steps.op_preview.outputs.PREVIEW_API_BEARER_TOKEN }}

          CLOUDFLARE_API_TOKEN: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && steps.op_production.outputs.CLOUDFLARE_API_TOKEN || steps.op_preview.outputs.CLOUDFLARE_API_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op_production.outputs.CLOUDFLARE_ACCOUNT_ID || steps.op_preview.outputs.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_POLICY_AUD: ${{ steps.op_production.outputs.ACCESS_POLICY_AUD || steps.op_preview.outputs.ACCESS_POLICY_AUD }}

          GITHUB_TOKEN: ${{ github.token }}

          ACCESS_APP_HOSTNAME: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.event == 'pull_request' &&
                format(
                  'pr-{0}-bankglass.{1}.workers.dev',
                  github.event.workflow_run.pull_requests[0].number,
                  steps.op_preview.outputs.CLOUDFLARE_WORKERS_SUBDOMAIN
                ) ||
                steps.op_production.outputs.ACCESS_APP_HOSTNAME ||
                steps.op_preview.outputs.ACCESS_APP_HOSTNAME }}

          ACCESS_TEAM_DOMAIN: ${{ steps.op_production.outputs.ACCESS_TEAM_DOMAIN || steps.op_preview.outputs.ACCESS_TEAM_DOMAIN }}
          AKAHU_API_BASE_URL: ${{ steps.op_production.outputs.AKAHU_API_BASE_URL || steps.op_preview.outputs.AKAHU_API_BASE_URL }}
          API_RATE_LIMIT_PER_MINUTE: ${{ steps.op_production.outputs.API_RATE_LIMIT_PER_MINUTE || steps.op_preview.outputs.API_RATE_LIMIT_PER_MINUTE }}
          REFRESH_COOLDOWN_SECONDS: ${{ steps.op_production.outputs.REFRESH_COOLDOWN_SECONDS || steps.op_preview.outputs.REFRESH_COOLDOWN_SECONDS }}
          SYNC_LOOKBACK_DAYS: ${{ steps.op_production.outputs.SYNC_LOOKBACK_DAYS || steps.op_preview.outputs.SYNC_LOOKBACK_DAYS }}

        with:
          worker-name: bankglass
          preview-compatibility-date: "2026-07-11"
          preview-compatibility-flags: '["nodejs_compat"]'
          preview-state-url: ${{ vars.ALCHEMY_PREVIEW_STATE_URL }}
          preview-state-expected-origin: ${{ vars.ALCHEMY_PREVIEW_STATE_EXPECTED_ORIGIN }}
          preview-state-token: ${{ steps.op_preview_state.outputs.ALCHEMY_PREVIEW_STATE_TOKEN }}
          # Preview-only public defaults; BANK_STORE requires an isolated binding.
          worker-config: >-
            {"AKAHU_API_BASE_URL":"https://api.akahu.io/v1","API_RATE_LIMIT_PER_MINUTE":"60","REFRESH_COOLDOWN_SECONDS":"3600","SYNC_LOOKBACK_DAYS":"14"}
          worker-secrets: >-
            ${{ format('{{"ACCESS_APP_HOSTNAME":{0},"ACCESS_POLICY_AUD":{1},"ACCESS_TEAM_DOMAIN":{2},"AKAHU_APP_TOKEN":{3},"AKAHU_USER_TOKEN":{3},"API_BEARER_TOKEN":{4}}}',
                toJSON(format('pr-{0}-bankglass.{1}.workers.dev', github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number, steps.op_preview.outputs.CLOUDFLARE_WORKERS_SUBDOMAIN)),
                toJSON(steps.op_preview.outputs.ACCESS_POLICY_AUD || ''),
                toJSON(steps.op_preview.outputs.ACCESS_TEAM_DOMAIN || ''),
                toJSON('preview-provider-disabled'),
                toJSON(steps.op_preview.outputs.PREVIEW_API_BEARER_TOKEN || '')) }}
          deploy-command: bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://${{ steps.op_production.outputs.ACCESS_APP_HOSTNAME }}
          use-adopt: true
