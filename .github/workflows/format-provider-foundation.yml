name: Format provider foundation

on:
  push:
    branches:
      - refactor/provider-connection-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/provider-connection-foundation

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Ultracite fixes
        run: bun run fix

      - name: Commit non-workflow formatter output
        shell: bash
        run: |
          cp .github/workflows/deploy.yml .formatted-deploy.yml
          git restore .github/workflows/deploy.yml .github/workflows/format-provider-foundation.yml
          if git diff --quiet && git status --porcelain --untracked-files=all | grep -q '^?? .formatted-deploy.yml$'; then
            :
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply Ultracite formatting"
          git push origin HEAD:refactor/provider-connection-foundation
